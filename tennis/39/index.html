<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Court in 3D · The Tennis Formula</title><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:#0e0e12;color:#fff;font-family:Arial,Helvetica,sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:clamp(8px,1.6dvh,20px) 12px;}
h1{font-size:clamp(15px,2.7dvh,24px);font-weight:900;color:#00e5ff;}
.sub{color:#8a9aaa;font-size:clamp(10px,1.5dvh,13px);margin:3px 0 clamp(4px,1dvh,12px);text-align:center;}
#stage{flex:1;min-height:80px;width:min(92vw,560px);perspective:900px;touch-action:none;}
#court{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(55deg) rotateZ(0deg);transition:transform .05s linear;}
svg{width:100%;height:100%;}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:clamp(4px,1dvh,12px);max-width:560px;}
.stat{background:#141e30;border:1px solid #2a3a5a;border-radius:8px;padding:clamp(4px,0.8dvh,8px) 10px;text-align:center;}
.stat .v{color:#ffe000;font-weight:900;font-size:clamp(11px,1.8dvh,16px);}
.stat .l{color:#8a9aaa;font-size:clamp(7px,1.1dvh,10px);letter-spacing:1px;}
.chk{background:#141e30;border:1.5px solid #B8860B;border-radius:10px;padding:clamp(6px,1.2dvh,12px) 12px;margin-top:clamp(4px,1dvh,12px);width:min(92vw,560px);}
.chk .t{color:#ffe000;font-weight:900;font-size:clamp(10px,1.6dvh,14px);letter-spacing:1px;margin-bottom:6px;text-align:center;}
.chk .r{display:flex;gap:6px;align-items:center;justify-content:center;}
.chk input{flex:1;min-width:0;background:#0e0e12;border:1px solid #2a3a5a;border-radius:6px;color:#fff;font-weight:900;font-size:clamp(11px,1.6dvh,14px);padding:clamp(5px,1dvh,8px) 4px;text-align:center;}
.chk input::placeholder{color:#5a6a7a;font-weight:700;font-size:clamp(9px,1.3dvh,12px);}
.chk button{background:#B8860B;color:#fff;border:none;font-weight:900;font-size:clamp(10px,1.5dvh,13px);padding:clamp(5px,1dvh,9px) 14px;border-radius:8px;}
#ck{color:#c8d8ea;font-size:clamp(9px,1.4dvh,12.5px);margin-top:5px;min-height:15px;text-align:center;}
a.back{color:#B8860B;font-size:clamp(10px,1.4dvh,12px);font-weight:900;text-decoration:none;margin-top:clamp(4px,1dvh,12px);letter-spacing:1px;}
.pick{display:flex;gap:8px;margin-bottom:clamp(4px,1dvh,10px);}
.pick .opt{font-weight:900;font-size:clamp(9px,1.4dvh,12px);letter-spacing:1px;padding:clamp(4px,0.9dvh,8px) 14px;border-radius:9px;text-decoration:none;}
.pick .here{background:#00e5ff;color:#08222a;border:1.5px solid #00e5ff;}
.pick .ar{background:#141e30;color:#7bffdf;border:1.5px solid #7bffdf;}
</style></head><body>
<h1>THE COURT IN 3D</h1>
<div class="sub">Page 39, off the paper. Drag to spin. Every line is a measurement.</div>
<div class="pick">
  <span class="opt here">ON SCREEN &middot; YOU'RE HERE</span>
  <a class="opt ar" href="/tennis/camera/?mode=court">&#128247; AR ON YOUR BOOK</a>
</div>
<div id="stage"><div id="court">
<svg viewBox="0 0 260 130">
  <rect x="10" y="10" width="240" height="110" fill="#2a5298" stroke="#fff" stroke-width="1.6" rx="1"/>
  <rect x="10" y="24" width="240" height="82" fill="none" stroke="#fff" stroke-width="1"/>
  <line x1="130" y1="10" x2="130" y2="120" stroke="#fff" stroke-width="1.8"/>
  <line x1="66" y1="24" x2="66" y2="106" stroke="#fff" stroke-width="1"/>
  <line x1="194" y1="24" x2="194" y2="106" stroke="#fff" stroke-width="1"/>
  <line x1="66" y1="65" x2="194" y2="65" stroke="#fff" stroke-width="1"/>
  <text x="130" y="8" fill="#ffe000" font-size="7" text-anchor="middle" font-weight="bold">23.77 m</text>
  <text x="256" y="68" fill="#ffe000" font-size="7" text-anchor="middle" font-weight="bold" transform="rotate(90,256,68)">10.97 m</text>
  <text x="98" y="47" fill="#ffea00" font-size="6" text-anchor="middle">6.40 m</text>
  <text x="38" y="68" fill="#cfe8ff" font-size="6" text-anchor="middle">no-man's land</text>
  <circle id="ball" cx="20" cy="65" r="4" fill="#dfff4f"/>
</svg>
</div></div>
<div class="stats">
  <div class="stat"><div class="v">23.77 m</div><div class="l">FULL LENGTH</div></div>
  <div class="stat"><div class="v">10.97 m</div><div class="l">DOUBLES WIDTH</div></div>
  <div class="stat"><div class="v">8.23 m</div><div class="l">SINGLES WIDTH</div></div>
  <div class="stat"><div class="v">6.40 × 4.115 m</div><div class="l">SERVICE BOX</div></div>
</div>
<div class="chk">
  <div class="t">CHECK YOUR PAGE 39 ANSWERS</div>
  <div class="r">
    <input id="c1" type="number" step="0.01" placeholder="Singles m&#178;">
    <input id="c2" type="number" step="0.01" placeholder="Doubles m&#178;">
    <input id="c3" type="number" step="0.01" placeholder="Box m&#178;">
    <button id="check">CHECK</button>
  </div>
  <div id="ck"></div>
</div>
<a class="back" href="/tennis/">&#8592; THE AR COURT</a>
<script>
var court=document.getElementById('court'),stage=document.getElementById('stage');
var rx=55,rz=0,dragging=false,lx=0,ly=0;
function apply(){court.style.transform='rotateX('+rx+'deg) rotateZ('+rz+'deg)';}
function down(x,y){dragging=true;lx=x;ly=y;}
function move(x,y){if(!dragging)return;rz+=(x-lx)*0.4;rx-=(y-ly)*0.3;rx=Math.max(15,Math.min(80,rx));lx=x;ly=y;apply();}
stage.addEventListener('mousedown',function(e){down(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){move(e.clientX,e.clientY);});
window.addEventListener('mouseup',function(){dragging=false;});
stage.addEventListener('touchstart',function(e){var t=e.touches[0];down(t.clientX,t.clientY);e.preventDefault();},{passive:false});
stage.addEventListener('touchmove',function(e){var t=e.touches[0];move(t.clientX,t.clientY);e.preventDefault();},{passive:false});
window.addEventListener('touchend',function(){dragging=false;});
var ball=document.getElementById('ball'),t=0;
setInterval(function(){t+=0.016;var p=(t%3)/3;ball.setAttribute('cx',20+220*p);ball.setAttribute('cy',65-40*Math.sin(Math.PI*p));},16);
document.getElementById('check').addEventListener('click',function(){
 var T=[[+document.getElementById('c1').value,195.63],[+document.getElementById('c2').value,260.76],[+document.getElementById('c3').value,26.34]];
 var names=['Singles','Doubles','Service box'];var out=[];
 for(var i=0;i<3;i++){var v=T[i][0],tt=T[i][1];
  if(!v){out.push(names[i]+': type your answer');}
  else if(Math.abs(v-tt)<=0.5){out.push('&#9989; '+names[i]+' correct');}
  else{out.push('&#10060; '+names[i]+': not quite, back to page 39');}}
 document.getElementById('ck').innerHTML=out.join(' &nbsp;&middot;&nbsp; ');});
</script>
</body></html>
